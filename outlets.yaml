# Outlets: names, card looks, and logo links. Edit freely; restart the app after changes.
#
# Each outlet is keyed by the name shown on the card, and has:
#   domains:     sites that map to this name (subdomains match automatically)
#   background:  card background color      text: headline color      accent: header band / stripe color
#   font:        serif or sans              (headline typeface)
#   header:      band (colored header bar) or stripe (left stripe)
#   weight:      regular, bold, or black    (black thickens the bold font slightly; there is no true Black)
#   name_color:  optional. Outlet-name color at the top. Defaults to the accent color.
#                Only applies to the stripe header; on a band the name is white or black, whichever reads better.
#   logo:        optional. Link to a PNG, JPG, or WebP logo (not SVG). Downloaded once, then cached.
#                A file in the logos folder takes priority over this link.
# Colors must be in quotes ("#ffffff"), since # starts a comment in YAML.
# Colors are from memory and approximate. Unlisted outlets use the default look below.

default:
  background: "#fafaf8"
  text: "#141820"
  accent: "#d62828"
  font: serif
  header: stripe
  weight: bold

